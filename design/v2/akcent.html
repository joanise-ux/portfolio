<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akcent: persymona vs głęboka</title>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600;700&family=Modak&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #15120f; color: #f3ebdd; font-family: Outfit, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #2e2822; min-height: 100vh; }
      section { background: #15120f; padding: 28px 32px; display: grid; gap: 14px; align-content: start; }
      .tag { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #a99e8e; }
      .word { font: 400 96px/0.9 Modak, sans-serif; color: var(--a); margin: 0; }
      .hello { font: 700 44px/1 DynaPuff, sans-serif; margin: 0; }
      .hello em { font-style: normal; color: var(--a); }
      p { margin: 0; max-width: 34ch; color: #a99e8e; font-size: 15px; line-height: 1.5; }
      a { color: var(--a); font-weight: 500; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .btn { background: var(--a); color: #15120f; border-radius: 99px; padding: 10px 18px; font-weight: 600; font-size: 14px; }
      .ghost { border: 1px solid var(--a); color: var(--a); border-radius: 99px; padding: 9px 18px; font-size: 14px; }
      svg { width: 190px; height: 190px; fill: var(--a); }
      @media (max-width: 640px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <section style="--a: #f0532a" data-name="P2 · Persymona · #F0532A · tekst na tle 5,31:1 (AA)"></section>
      <section style="--a: #d2401c" data-name="P3 · Persymona głęboka · #D2401C · tekst na tle 3,99:1 (tylko duży)"></section>
    </main>
    <script type="module">
      import { sampleShape } from "/src/lab/nuri.js";
      const pts = sampleShape(300, 180);
      let dots = "";
      for (let i = 0; i < pts.length; i += 2) dots += `<circle cx="${(pts[i] + 100).toFixed(1)}" cy="${(100 - pts[i + 1]).toFixed(1)}" r="3.3"/>`;
      for (const s of document.querySelectorAll("section")) {
        s.innerHTML = `
          <div class="tag">${s.dataset.name}</div>
          <h1 class="word">work</h1>
          <h2 class="hello">Cześć, jestem <em>Joanna</em></h2>
          <svg viewBox="0 0 200 200">${dots}</svg>
          <p>Mały tekst w akcencie: <a href="#">zobacz case study →</a> i <a href="#">napisz do mnie</a>.</p>
          <div class="row"><span class="btn">Zobacz projekty</span><span class="ghost">Pobierz CV</span></div>`;
      }
    </script>
  </body>
</html>
