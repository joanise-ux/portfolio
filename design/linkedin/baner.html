<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Baner LinkedIn — Joanna Żuczkowska</title>
    <!-- LinkedIn cover: 1584 × 396. Open with ?lang=en for the English one.
         The profile photo covers the bottom-left corner, so nothing sits there. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Outfit:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #15120f;
        --line: #2e2822;
        --ink: #f3ebdd;
        --muted: #a99e8e;
        --accent: #f0532a;
      }
      html,
      body {
        margin: 0;
        background: #0e0c0a;
      }
      .banner {
        position: relative;
        width: 1584px;
        height: 396px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: Outfit, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .banner svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .copy {
        position: absolute;
        left: 520px;
        top: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tag i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
      }
      h1 {
        margin: 0;
        font: 600 44px/1.14 DynaPuff, system-ui, sans-serif;
        letter-spacing: -0.005em;
        white-space: nowrap;
      }
      h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .what {
        font-size: 17px;
        color: var(--muted);
        white-space: nowrap;
      }
      .what b {
        font-weight: 400;
        color: var(--line);
        margin: 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="banner" id="banner">
      <svg viewBox="0 0 1584 396" id="art" aria-hidden="true"></svg>
      <div class="copy" id="copy"></div>
    </div>

    <script type="module">
      import { sampleShape, shapeSpacing } from "/src/nuri.js";

      const COPY = {
        pl: {
          tag: "Product / UX Designer",
          head: "Projektuję produkty cyfrowe —<br />od podstaw marki<br />po <em>gotowy interfejs.</em>",
          what: ["Branding", "Product design", "E-commerce", "Prototypy z AI"],
        },
        en: {
          tag: "Product / UX Designer",
          head: "I design digital products —<br />from brand foundations<br />to <em>shipped interfaces.</em>",
          what: ["Branding", "Product design", "E-commerce", "AI-assisted prototyping"],
        },
      };
      const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pl";
      const c = COPY[lang];
      document.documentElement.lang = lang;
      document.getElementById("copy").innerHTML = `
        <div class="tag"><i></i>${c.tag}</div>
        <h1>${c.head}</h1>
        <div class="what">${c.what.join("<b>·</b>")}</div>`;

      const W = 1584;
      const H = 396;
      const LINE = "#2e2822";
      const INK = "#f3ebdd";
      const ACCENT = "#f0532a";

      // Nuri, in dots, on the right
      const SIZE = 230;
      const NX = 1408;
      const NY = 200;
      const COUNT = 400;
      const pts = sampleShape(COUNT, SIZE);
      const r = shapeSpacing(COUNT, SIZE) * 0.39;
      // her cheeks, in the 200-box of src/nuri.js
      const cheeks = [
        [60, 131],
        [136, 131],
      ];
      const k = SIZE / 200;
      let nuri = "";
      for (let i = 0; i < pts.length; i += 2) {
        const bx = pts[i] / k + 100;
        const by = 100 - pts[i + 1] / k;
        const blush = cheeks.some(([cx, cy]) => ((bx - cx) / 10.5) ** 2 + ((by - cy) / 6.5) ** 2 < 1);
        nuri += `<circle cx="${(NX + pts[i]).toFixed(1)}" cy="${(NY - pts[i + 1]).toFixed(1)}" r="${r.toFixed(2)}" fill="${blush ? ACCENT : INK}"/>`;
      }

      // the dot field behind: quiet under the copy, clearer towards Nuri,
      // and it leaves a little air around her
      const STEP = 26;
      let field = "";
      for (let y = STEP / 2, row = 0; y < H; y += STEP * 0.866, row++) {
        for (let x = (row % 2 ? STEP / 2 : 0) + 4; x < W; x += STEP) {
          const d = Math.hypot((x - NX) / 152, (y - NY) / 142);
          if (d < 1) continue;
          const t = Math.min(1, Math.max(0, (x - 380) / 900));
          const o = 0.35 + 0.65 * t;
          field += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${LINE}" opacity="${o.toFixed(2)}"/>`;
        }
      }

      document.getElementById("art").innerHTML = field + nuri;
      document.fonts.ready.then(() => document.body.classList.add("is-ready"));
    </script>
  </body>
</html>
