<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>lab — v2 motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Modak&family=Outfit:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/lab/lab.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <header class="who">
      <span class="who__name">Joanna Żuczkowska</span>
      <span class="who__role">UX/UI designer</span>
    </header>

    <div class="cursor-label" id="cursorLabel" aria-hidden="true">
      <span class="cursor-label__dot"></span>
      <span class="cursor-label__name"></span>
    </div>

    <div class="caption" id="caption" aria-live="polite">
      <span class="caption__name"></span>
      <span class="caption__cat"></span>
    </div>

    <div class="hint" id="hint"></div>

    <nav class="list" id="list"></nav>

    <article class="case" id="case" tabindex="-1" aria-label="Case study"></article>

    <article class="page" id="about" tabindex="-1" aria-label="About"></article>
    <article class="page" id="kontakt" tabindex="-1" aria-label="Kontakt"></article>

    <!-- labels and link texts are filled in by main.js, in the page's language -->
    <nav class="dock">
      <button type="button" class="dock__mark" id="replay">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <path d="M26 176 C6 176 2 158 14 148 C28 138 30 122 32 104 C34 86 40 68 50 56 C47 42 50 29 57 28 C64 28 72 38 78 45 C90 41 102 41 114 45 C120 37 128 28 135 28 C142 29 143 43 140 56 C152 68 158 88 160 106 C162 124 166 138 178 148 C188 158 184 176 166 176 C120 181 66 181 26 176 Z" />
          <path d="M154 130 C170 128 179 114 177 96 C176 86 191 84 191 95 C193 120 178 140 158 142 Z" />
          <ellipse class="dock__eye" cx="78" cy="114" rx="8" ry="13" />
          <ellipse class="dock__eye" cx="118" cy="114" rx="8" ry="13" />
        </svg>
      </button>
      <a href="./" class="is-active" data-go="work" aria-current="page">Work</a>
      <a href="#about" data-go="about">About</a>
      <a href="#kontakt" data-go="kontakt">Kontakt</a>
      <span class="dock__sep"></span>
      <span class="dock__pair" id="langSwitch" role="group">
        <button type="button" class="dock__lang" data-lang="pl" lang="pl" aria-label="Polski">PL</button>
        <button type="button" class="dock__lang" data-lang="en" lang="en" aria-label="English">EN</button>
      </span>
      <span class="dock__sep dock__sep--view"></span>
      <span class="dock__pair" id="viewSwitch" role="group">
        <button type="button" class="dock__icon is-on" data-view="orbita" aria-pressed="true"><i class="ico-orbit"></i></button>
        <button type="button" class="dock__icon" data-view="lista" aria-pressed="false"><i class="ico-list"></i></button>
      </span>
    </nav>

    <script type="module" src="/src/lab/main.js"></script>
  </body>
</html>
